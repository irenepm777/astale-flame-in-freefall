<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <!-- Spacecraft galley (our own drawing for the Astale home page): module wall with water dispenser, food warmer, velcro food bags and tray -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe3ea"/><stop offset="1" stop-color="#aab1bf"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5f8"/><stop offset="1" stop-color="#c9ced8"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e96a5"/><stop offset=".5" stop-color="#e8ebf0"/><stop offset="1" stop-color="#7d8595"/></linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f3e8"/><stop offset="1" stop-color="#cfc7b0"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <!-- module wall with panels and handrails -->
  <rect width="600" height="420" fill="url(#wall)"/>
  <g stroke="#9aa1ae" stroke-width="2" fill="none" opacity=".7">
    <rect x="14" y="14" width="186" height="392" rx="8"/><rect x="214" y="14" width="186" height="392" rx="8"/><rect x="414" y="14" width="172" height="392" rx="8"/>
  </g>
  <g fill="#7f8796"><circle cx="30" cy="30" r="4"/><circle cx="184" cy="30" r="4"/><circle cx="230" cy="30" r="4"/><circle cx="384" cy="30" r="4"/><circle cx="430" cy="30" r="4"/><circle cx="570" cy="30" r="4"/></g>
  <rect x="0" y="0" width="600" height="420" fill="url(#glow)"/>

  <!-- water dispenser: hot (red) and cold (blue) -->
  <g filter="url(#sh)">
    <rect x="34" y="40" width="146" height="170" rx="10" fill="url(#panel)" stroke="#8e96a5" stroke-width="2"/>
    <rect x="50" y="56" width="114" height="36" rx="5" fill="#1d2433"/>
    <text x="107" y="80" fill="#5ef0a0" font-family="monospace" font-size="17" text-anchor="middle">H2O 80°</text>
    <circle cx="74" cy="118" r="14" fill="#d93a2f"/><circle cx="140" cy="118" r="14" fill="#2f74d9"/>
    <text x="74" y="150" fill="#3a4150" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle">HOT</text>
    <text x="140" y="150" fill="#3a4150" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle">COLD</text>
    <rect x="96" y="160" width="22" height="34" rx="4" fill="url(#metal)"/><rect x="102" y="192" width="10" height="12" fill="#6e7686"/>
  </g>
  <!-- food bag on the nozzle, rehydrating -->
  <g filter="url(#sh)" transform="rotate(-6 107 250)">
    <rect x="80" y="206" width="54" height="78" rx="8" fill="url(#pouch)" stroke="#a89f86"/>
    <rect x="80" y="226" width="54" height="16" fill="#e0742f"/>
    <text x="107" y="238" fill="#fff" font-family="system-ui,sans-serif" font-size="10" font-weight="800" text-anchor="middle">SOUP</text>
  </g>

  <!-- food warmer (open case with cans and bags) -->
  <g filter="url(#sh)">
    <path d="M226 132 L388 132 L372 72 L242 72 Z" fill="#c7ccd6" stroke="#8e96a5" stroke-width="2"/>
    <rect x="226" y="132" width="162" height="96" rx="8" fill="url(#metal)" stroke="#6e7686" stroke-width="2"/>
    <rect x="236" y="142" width="142" height="62" rx="5" fill="#2b3240"/>
    <g fill="#cfd5df"><rect x="244" y="150" width="28" height="46" rx="4"/><rect x="278" y="150" width="28" height="46" rx="4"/><rect x="312" y="150" width="28" height="46" rx="4"/><rect x="346" y="150" width="24" height="46" rx="4"/></g>
    <g fill="#e0742f"><rect x="244" y="164" width="28" height="9"/><rect x="278" y="164" width="28" height="9" fill="#3aa35c"/><rect x="312" y="164" width="28" height="9" fill="#c9a227"/><rect x="346" y="164" width="24" height="9" fill="#2f74d9"/></g>
    <text x="307" y="221" fill="#1d2433" font-family="system-ui,sans-serif" font-size="12" font-weight="800" text-anchor="middle">FOOD WARMER</text>
    <circle cx="374" cy="216" r="4" fill="#5ef0a0"/>
  </g>

  <!-- wall of food bags held with velcro -->
  <g filter="url(#sh)">
    <rect x="428" y="40" width="144" height="10" rx="3" fill="#2a2f3a"/>
    <rect x="428" y="148" width="144" height="10" rx="3" fill="#2a2f3a"/>
    <g>
      <rect x="434" y="54" width="40" height="84" rx="6" fill="url(#pouch)" stroke="#a89f86"/><rect x="434" y="72" width="40" height="12" fill="#3aa35c"/>
      <rect x="480" y="54" width="40" height="84" rx="6" fill="url(#pouch)" stroke="#a89f86"/><rect x="480" y="72" width="40" height="12" fill="#c9a227"/>
      <rect x="526" y="54" width="40" height="84" rx="6" fill="url(#pouch)" stroke="#a89f86"/><rect x="526" y="72" width="40" height="12" fill="#d93a2f"/>
      <rect x="434" y="162" width="40" height="84" rx="6" fill="url(#pouch)" stroke="#a89f86"/><rect x="434" y="180" width="40" height="12" fill="#2f74d9"/>
      <rect x="480" y="162" width="40" height="84" rx="6" fill="url(#pouch)" stroke="#a89f86"/><rect x="480" y="180" width="40" height="12" fill="#e0742f"/>
      <rect x="526" y="162" width="40" height="84" rx="6" fill="url(#pouch)" stroke="#a89f86"/><rect x="526" y="180" width="40" height="12" fill="#3aa35c"/>
    </g>
  </g>

  <!-- tray with bags and cutlery, fixed to the wall -->
  <g filter="url(#sh)">
    <rect x="196" y="262" width="236" height="96" rx="12" fill="#5d6576" stroke="#3f4655" stroke-width="2"/>
    <rect x="212" y="276" width="56" height="68" rx="7" fill="url(#pouch)" stroke="#a89f86"/><rect x="212" y="292" width="56" height="12" fill="#c9a227"/>
    <rect x="280" y="276" width="56" height="68" rx="7" fill="url(#pouch)" stroke="#a89f86"/><rect x="280" y="292" width="56" height="12" fill="#3aa35c"/>
    <rect x="352" y="282" width="8" height="58" rx="3" fill="url(#metal)"/><ellipse cx="356" cy="282" rx="9" ry="13" fill="url(#metal)"/>
    <rect x="374" y="282" width="6" height="58" rx="2" fill="url(#metal)"/><path d="M369 282 v-16 M374 282 v-16 M379 282 v-16 M384 282 v-16" stroke="#9aa1ae" stroke-width="3"/>
    <rect x="396" y="278" width="22" height="60" rx="5" fill="#2f74d9" opacity=".85"/>
  </g>
  <!-- floating bag (microgravity) -->
  <g filter="url(#sh)" transform="rotate(18 520 320)">
    <rect x="498" y="282" width="44" height="66" rx="7" fill="url(#pouch)" stroke="#a89f86"/><rect x="498" y="298" width="44" height="11" fill="#d93a2f"/>
  </g>
  <path d="M494 352 q8 -10 16 0 M552 270 q8 -10 16 0" stroke="#8e96a5" stroke-width="2" fill="none" opacity=".7"/>
</svg>
